jobs:
  build-test-upload:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Build
          command: mvn -B -DskipTests clean package
      - run:
          name: Test and Generate Coverage Report
          command: mvn clean test jacoco:report
      - codecov/upload:
          file: target/site/jacoco/jacoco.xml
workflows:
  version: 2
  main:
    jobs:
      - build-test-upload
